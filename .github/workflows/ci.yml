name: CI

# Runs the repo's own scripts — `check`, `test`, `build` — on every pull
# request and on every push to main. `pages.yml` deploys; this is the gate
# that says the thing being deployed is sound.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One run per ref. PR runs are superseded by the next push; main runs are
# not cancelled, so every commit on the default branch keeps a real verdict.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, format, typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        # `bun run lint && bun run format && bun run typecheck`
        run: bun run check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        # `vitest run --coverage`
        run: bun run test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        # `tsc -b && vite build && obs:check` — the OBS bundle check
        # (scripts/check-obs-bundle.ts) runs for free at the end of it.
        run: bun run build

  site:
    name: Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        # apps/site is its own package until the repo moves to Bun workspaces.
        run: bun install --frozen-lockfile
        working-directory: apps/site

      - name: Build
        # Astro + Starlight static build to apps/site/dist (vellumhud.com).
        run: bun run build
        working-directory: apps/site

  ci-success:
    name: CI Success
    # The single aggregate gate: make this the required status check for
    # `main`, and adding a job above only requires extending `needs:`.
    #
    # `if: always()` makes this job RUN even when a dependency failed — it
    # does NOT make it FAIL with them. The step below is what turns a failed
    # dependency into a failed gate; without it this check is permanently
    # green and gates nothing.
    if: always()
    needs: [check, test, build, site]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any dependency failed
        # Tests for failure/cancelled rather than "not success", so a job
        # that is legitimately skipped leaves the gate passing.
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
