name: Redirect GitHub Pages to vellumhud.com

# Vellum now lives at vellumhud.com (deploy.yml). The old Pages site stays up
# forever as a redirect stub so existing links and OBS browser sources keep
# working: every path, including unknown ones via 404.html, runs
# deploy/github-pages-redirect/redirect.html, which forwards to the same path
# on vellumhud.com and hands app URLs their saved localStorage data in the URL
# fragment (never sent to a server).

on:
  push:
    branches: [main]
    paths:
      - 'deploy/github-pages-redirect/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble redirect stub
        # The stub at every path the old site ever served, plus 404.html for
        # everything else. Pinned app versions are listed explicitly because
        # GitHub Pages serves 404.html with a 404 status, which OBS tolerates
        # but some tools do not.
        run: |
          STUB=deploy/github-pages-redirect/redirect.html
          for dir in . app app/v0.2.0; do
            mkdir -p "_pages/$dir"
            cp "$STUB" "_pages/$dir/index.html"
          done
          cp "$STUB" _pages/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
